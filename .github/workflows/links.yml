# The live link check. Weekly, so a dead source is found before a reader finds it.
name: links
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/gate.py --links-only
